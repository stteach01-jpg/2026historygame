<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>歷史大富翁</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <main class="game-shell">
      <section class="topbar" aria-label="遊戲狀態">
        <div>
          <p class="eyebrow">國中歷史一到三年級</p>
          <h1>歷史大富翁</h1>
        </div>
        <div class="stats">
          <span id="turn-label">尚未開始</span>
          <span id="dice-label">骰子 -</span>
          <span id="round-label">第 0 回合</span>
        </div>
        <div class="mode-actions">
          <button id="toggle-teacher" type="button">教師後台</button>
          <button id="toggle-projector" type="button">投影模式</button>
        </div>
      </section>

      <section class="setup-panel" id="setup-panel" aria-label="玩家登入">
        <div>
          <h2>玩家登入</h2>
          <p>請用班級與座號登入，例如：902-02。只記錄代號，不輸入姓名。</p>
        </div>
        <form class="login-form" id="login-form">
          <input
            id="player-id"
            type="text"
            inputmode="text"
            autocomplete="off"
            placeholder="902-02"
            aria-label="玩家代號"
            maxlength="6"
          />
          <button type="submit">加入</button>
        </form>
        <div class="player-list" id="setup-player-list"></div>
        <p class="setup-message" id="setup-message">加入玩家後開始遊戲。</p>
        <button class="primary-action" id="start-game" type="button">開始遊戲</button>
      </section>

      <section class="play-layout is-hidden" id="play-layout">
        <section class="board-wrap" aria-label="36 格歷史大富翁棋盤">
          <section class="projection-screen" id="projection-screen" aria-live="polite">
            <div class="projection-status">
              <span id="projection-player">目前玩家 -</span>
              <span id="projection-position">位置：起點</span>
              <span id="projection-dice">骰子 -</span>
            </div>
            <p class="projection-meta" id="projection-meta">等待擲骰</p>
            <h2 id="projection-question">投影模式會在這裡顯示目前題目。</h2>
            <div class="projection-answers" id="projection-answers"></div>
            <p class="projection-answer is-hidden" id="projection-answer"></p>
          </section>
          <div class="board" id="board"></div>
        </section>

        <aside class="side-panel" aria-label="遊戲操作">
          <div class="current-card">
            <p class="eyebrow">目前玩家</p>
            <h2 id="current-player">-</h2>
            <p id="position-label">位置：起點</p>
          </div>

          <button class="roll-button" id="roll-dice" type="button">擲骰子</button>

          <section class="question-card is-hidden" id="question-card" aria-live="polite">
            <p class="question-meta" id="question-meta"></p>
            <h2 id="question-title"></h2>
            <div class="answers" id="answers"></div>
          </section>

          <section class="message-card">
            <p id="message">加入玩家後開始遊戲。</p>
          </section>

          <section class="players-panel">
            <h2>玩家位置</h2>
            <div id="player-list"></div>
          </section>

          <section class="teacher-panel is-collapsed" id="teacher-panel">
            <div class="panel-title">
              <h2>教師後台</h2>
              <span id="question-count">已出題 0 / 70</span>
            </div>
            <div class="teacher-controls">
              <button id="reveal-answer" type="button">顯示答案</button>
              <button id="mark-correct" type="button">判定答對</button>
              <button id="mark-wrong" type="button">判定答錯</button>
              <button id="force-next" type="button">下一位</button>
            </div>
            <div class="teacher-log" id="teacher-log">尚未開始課堂紀錄。</div>
          </section>

          <button class="icon-button" id="reset" type="button" aria-label="重新開始" title="重新開始">
            &#8635;
          </button>
        </aside>
      </section>
    </main>
    <script src="./src/data/questions.js"></script>
    <script src="./src/main.js"></script>
  </body>
</html>
